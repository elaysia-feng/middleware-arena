server:
  port: 9002
spring:
  application:
    name: community-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.0.192:8848}
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.0.192:8858}
        client-ip: ${SENTINEL_CLIENT_IP:192.168.0.197}
        port: ${SENTINEL_PORT:8721}
  rabbitmq:
    host: ${RABBIT_HOST:192.168.0.192}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
  data:
    redis:
      host: ${REDIS_HOST:192.168.0.192}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:application-sharding.yml?placeholder-type=environment
community:
  like:
    # 64 个 Redis Cluster hash-slot 分区，状态/计数/version/Stream 同分区同槽，Lua 可原子执行。
    redis-partitions: 64
    # 每个帖子再把点赞用户拆成 256 个 Hash，避免热门帖子形成单个超大 Hash。
    state-shards: 256
    relay-interval-ms: 200
    relay-batch-size: 200
    confirm-timeout-ms: 3000
    backlog-warn-size: 100000
    # RabbitMQ 长时间不可用时，单分区 Stream 达到硬阈值即拒绝新的状态变化，避免可靠 Outbox 变 BigKey。
    stream-hard-limit: 500000
    # 热门榜与统计幂等键保留两天。
    statistics-ttl-seconds: 172800
  # 旧 MySQL Transactional Outbox 留给尚未迁移的其它社区事件；点赞最终链路使用 Redis Stream Outbox。
  outbox:
    enabled: false
    relay-interval-ms: 5000
    relay-batch-size: 100
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
springdoc:
  swagger-ui:
    path: /swagger-ui.html
