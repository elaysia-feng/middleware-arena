# Middleware Arena 共用中间件
# 部署到 192.168.0.192，业务项目不在此 Compose 中启动。
#
# 启动全部共用中间件：
#   docker compose up -d
#
# 停止：
#   docker compose down

name: middleware-arena

services:
  redis:
    image: redis:7
    container_name: ma-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:management
    container_name: ma-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ma-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    mem_limit: 1g

  sentinel:
    image: bladex/sentinel-dashboard:1.8.9
    container_name: ma-sentinel
    restart: unless-stopped
    ports:
      - "8858:8858"
    mem_limit: 512m

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: ma-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    mem_limit: 2g

  seata:
    image: apache/seata-server:2.1.0
    container_name: ma-seata
    restart: unless-stopped
    ports:
      - "8091:8091"
      - "7091:7091"
    mem_limit: 1g

volumes:
  redis-data:
  rabbitmq-data:
  nacos-data:
  elasticsearch-data:

networks:
  default:
    name: middleware-arena-net
    driver: bridge
