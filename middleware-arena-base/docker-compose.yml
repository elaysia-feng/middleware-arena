# Middleware Arena — Docker Compose（16GB 内存按 Profile 分场景启停）
# 用法：
#   docker compose --profile base up -d --build   # 基础模式：mysql/redis/nacos/gateway/auth
#   docker compose --profile full up -d --build   # 全部服务（演示用，资源预算见注释）
#   docker compose down                            # 停止
#
# 构建策略：先在主机用 JDK21 构建各服务（mvn package），再 docker build 打镜像。
# 各服务仓库与本仓库是同级目录（../middleware-arena-xxx 作为 build context）。

name: middleware-arena

services:
  mysql:
    image: mysql:8.0
    container_name: ma-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: middleware_arena
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 1g
    profiles: ["base", "full"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7
    container_name: ma-redis
    ports:
      - "6379:6379"
    mem_limit: 512m
    profiles: ["base", "full"]

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ma-nacos
    environment:
      MODE: standalone
    ports:
      - "8848:8848"   # 控制台: http://localhost:8848/nacos
      - "9848:9848"   # gRPC
    mem_limit: 1g
    profiles: ["base", "full"]

  gateway:
    build: ../middleware-arena-gateway
    container_name: ma-gateway
    environment:
      NACOS_ADDR: nacos:8848
    depends_on:
      - nacos
    ports:
      - "8000:8000"
    mem_limit: 512m
    profiles: ["base", "full"]

  auth:
    build: ../middleware-arena-auth
    container_name: ma-auth
    environment:
      NACOS_ADDR: nacos:8848
    depends_on:
      - nacos
    ports:
      - "9001:9001"
    mem_limit: 512m
    profiles: ["base", "full"]

  # ===== 以下为 full 模式预留（本轮仅写配置，未保证全部启动）=====
  community:
    build: ../middleware-arena-community
    container_name: ma-community
    environment:
      NACOS_ADDR: nacos:8848
    depends_on:
      - nacos
    ports:
      - "9002:9002"
    mem_limit: 512m
    profiles: ["full"]

  experiment:
    build: ../middleware-arena-experiment
    container_name: ma-experiment
    environment:
      NACOS_ADDR: nacos:8848
    depends_on:
      - nacos
    ports:
      - "9003:9003"
    mem_limit: 512m
    profiles: ["full"]

  runner:
    build: ../middleware-arena-runner
    container_name: ma-runner
    environment:
      NACOS_ADDR: nacos:8848
    depends_on:
      - nacos
    ports:
      - "9004:9004"
    mem_limit: 1g
    profiles: ["full"]

  notification:
    build: ../middleware-arena-notification
    container_name: ma-notification
    environment:
      NACOS_ADDR: nacos:8848
    depends_on:
      - nacos
    ports:
      - "9005:9005"
    mem_limit: 512m
    profiles: ["full"]

  order:
    build: ../middleware-arena-order
    container_name: ma-order
    environment:
      NACOS_ADDR: nacos:8848
    depends_on:
      - nacos
      - mysql
    ports:
      - "9006:9006"
    mem_limit: 512m
    profiles: ["full"]

  storage:
    build: ../middleware-arena-storage
    container_name: ma-storage
    environment:
      NACOS_ADDR: nacos:8848
    depends_on:
      - nacos
      - mysql
    ports:
      - "9007:9007"
    mem_limit: 512m
    profiles: ["full"]

  account:
    build: ../middleware-arena-account
    container_name: ma-account
    environment:
      NACOS_ADDR: nacos:8848
    depends_on:
      - nacos
      - mysql
    ports:
      - "9008:9008"
    mem_limit: 512m
    profiles: ["full"]

  # TODO[AI Agent]：LangGraph 分析服务，full 模式预留
  agent:
    build: ../middleware-arena-agent
    container_name: ma-agent
    environment:
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "9500:9500"
    mem_limit: 1g
    profiles: ["full"]

  # TODO[Elasticsearch 搜索实验]：单节点、堆≤1GB、关安全特性，full 模式预留
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: ma-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
    ports:
      - "9200:9200"
    mem_limit: 2g
    profiles: ["full"]

volumes:
  mysql-data:
