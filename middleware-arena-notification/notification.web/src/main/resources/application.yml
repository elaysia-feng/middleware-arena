server:
  port: 9005

spring:
  application:
    name: notification-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.0.192:8848}
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.0.192:8858}
        client-ip: ${SENTINEL_CLIENT_IP:192.168.0.197}
        port: ${SENTINEL_PORT:8724}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
