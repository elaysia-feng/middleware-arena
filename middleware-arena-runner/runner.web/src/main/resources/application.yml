server:
  port: 9004

spring:
  application:
    name: runner-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.0.192:8848}
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.0.192:8858}
        client-ip: ${SENTINEL_CLIENT_IP:192.168.0.197}
        port: ${SENTINEL_PORT:8723}

  # Redis：任务实例状态缓存（键名见 runner.biz 的 RunnerRedisKeys）
  data:
    redis:
      host: ${REDIS_HOST:192.168.0.192}
      port: ${REDIS_PORT:6379}

  # ============================================================
  # RabbitMQ（runner 消费 experiment-service 投递的 RunnerTaskMessage）
  # 启用：取消注释 + 确保本地 RabbitMQ 已启动（默认 5672）。
  # 生产端在 experiment-service（RunnerCreaetTaskProducer / RunnerCancelTaskProducer），
  # 本服务只声明队列 / 绑定 / 死信 / 监听容器（RunnerRabbitConfig）。
  # 消费端：manual ack（@RabbitListener ackMode=MANUAL）+ retry（重试后仍失败进 DLQ）。
  # ============================================================
  rabbitmq:
    host: ${RABBIT_HOST:192.168.0.192}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual           # 手动 ACK（RunnerRabbitConfig 已显式指定 MANUAL，此处兜底）
        retry:
          enabled: true                    # 消费失败自动重试（瞬时异常抖动兜底）
          max-attempts: 3
          initial-interval: 1000ms
        default-requeue-rejected: false    # 重试耗尽后不进原队列（走 x-dead-letter-exchange → experiment.task.dlq）

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ============================================================
# Runner 运行配置（资源优先：先抢资源再建容器）
# 设计对齐：公共镜像常驻磁盘、实验环境按任务临时启动、baseline/candidate 串行、跑完即清理。
# 绑定见 runner.biz 的 RunnerProperties（@ConfigurationProperties(prefix="ma.runner")）。
# ============================================================
ma:
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucket: ${OSS_BUCKET:middleware-arena}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    max-files-bytes: ${OSS_MAX_FILES_BYTES:10485760}
  runner:
    docker:
      binary: docker
      host: ${DOCKER_HOST:unix:///var/run/docker.sock}
      command-timeout-seconds: 120
      container-prefix: ma-task
    # 平台全局资源上限（防大量普通用户把机器吃爆；真正建容器的最后防线是 --memory/--cpus）
    platform:
      scheduler-mode: ${RUNNER_SCHEDULER_MODE:LOCAL}
      max-concurrent: 3
      max-cpus: 4.0
      max-memory-mb: 8192
      # 固定留给宿主系统、Docker daemon 和 Runner JVM，不参与任务分配
      system-reserved-cpus: 0.5
      system-reserved-memory-mb: 1024
      free-acquire-timeout-ms: 10000
      vip-acquire-timeout-ms: 300000
    # 会员只决定并发上限；CPU/内存由 ExperimentType 按实验拓扑计算
    tiers:
      free:
        max-concurrent-per-user: 1
      vip:
        max-concurrent-per-user: 3
    # 单任务阶段性开销：预留量=max(构建阶段, 运行压测阶段)+per-task
    workload:
      build-cpus: 1.0
      build-memory-mb: 1024
      k6-cpus: 0.5
      k6-memory-mb: 512
      per-task-cpus: 0.25
      per-task-memory-mb: 256
    # 公共实验镜像（镜像常驻磁盘，按任务临时起容器）
    images:
      redis: redis:7
      rabbitmq: rabbitmq:management
      elasticsearch: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
      seata: seataio/seata-server:2.1.0
      mysql: mysql:8.0
      k6: grafana/k6:0.47.0
      probe: curlimages/curl:8.5.0
      baseline-prefix: "ma-"
      baseline-suffix: ":v1"
    # k6 压测档位（第一版从轻；VIP 再开放 50/100/200 VU、更长 duration）
    k6:
      work-dir: /tmp/ma-k6
      smoke-vus: 5
      smoke-seconds: 10
      warmup-vus: 10
      warmup-seconds: 20
      formal-vus: 20
      formal-seconds: 30
    # 用户 SUT 的构建环境（离线编译，对应 CLAUDE.md 约束）
    build:
      work-dir: /var/lib/ma-runner/work
      template-dir: /var/lib/ma-runner/templates
      maven: /usr/local/maven/bin/mvn
      jdk-home: /usr/local/jdk
      local-repo: /usr/local/maven/repo
      offline: true
    # 阶段进度回传（TODO：接入 MQ/Feign 后 enabled=true）
    progress:
      enabled: false
      target: mq
