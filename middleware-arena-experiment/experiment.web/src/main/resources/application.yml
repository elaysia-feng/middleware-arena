server:
  port: 9003

spring:
  application:
    name: experiment-service
  output:
    ansi:
      enabled: always
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.0.192:8848}
    sentinel:
      eager: true
      log:
        dir: ${SENTINEL_LOG_DIR:logs/sentinel/experiment}
        switch-pid: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.0.192:8858}
        client-ip: ${SENTINEL_CLIENT_IP:192.168.0.197}
        port: ${SENTINEL_PORT:8722}

  # Redis：取消任务时查询 runner 任务→实例登记（键名 runner:task:instance:{taskId}），定向投递取消消息
  data:
    redis:
      host: ${REDIS_HOST:192.168.0.192}
      port: ${REDIS_PORT:6379}

  # ============================================================
  # RabbitMQ（实验任务投递链路：experiment → runner.task.queue）
  # 生产端可靠性：publisher-confirm-type=correlated 才能收到 ConfirmCallback；
  #               publisher-returns=true + RabbitTemplate.setMandatory(true) 才能收到 ReturnsCallback。
  # 需本地 RabbitMQ 已启动（默认 5672，guest/guest）。
  # ============================================================
  rabbitmq:
    host: ${RABBIT_HOST:192.168.0.192}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    publisher-confirm-type: correlated     # Publisher Confirm（异步 ConfirmCallback）
    publisher-returns: true                # Mandatory/Return（不可路由消息回调）
  datasource:
    url: jdbc:mysql://${MYSQL_ADDR:127.0.0.1:3306}/ma_experiment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:@Feng050813}
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ma:
  internal-token: ${MA_INTERNAL_TOKEN:middleware-arena-internal-token}
  internal-auth:
    secret: ${MA_INTERNAL_AUTH_SECRET:middleware-arena-internal-token}
    replay-window-ms: 300000
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucket: ${OSS_BUCKET:middleware-arena}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    max-files-bytes: ${OSS_MAX_FILES_BYTES:10485760}
