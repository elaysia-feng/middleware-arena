server:
  port: 9006

spring:
  application:
    name: order-service
  output:
    ansi:
      enabled: always
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.0.192:8848}
    sentinel:
      eager: true
      log:
        dir: ${SENTINEL_LOG_DIR:logs/sentinel/order}
        switch-pid: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.0.192:8858}
        client-ip: ${SENTINEL_CLIENT_IP:192.168.0.197}
        port: ${SENTINEL_PORT:8725}
  data:
    redis:
      host: ${REDIS_HOST:192.168.0.192}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  datasource:
    url: jdbc:mysql://${MYSQL_ADDR:127.0.0.1:3306}/ma_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:@Feng050813}
    driver-class-name: com.mysql.cj.jdbc.Driver

seata:
  enabled: true
  tx-service-group: middleware_arena_tx_group
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      middleware_arena_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:192.168.0.192:8091}

ma:
  internal-auth:
    secret: ${MA_INTERNAL_AUTH_SECRET:middleware-arena-internal-token}
    replay-window-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
